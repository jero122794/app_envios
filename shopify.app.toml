# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "afa4b47492bdbcc106bf44ee9d1cd714"
name = "envios-colombia"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_delivery_customizations,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[metaobjects.app.municipality_zone]
name = "Municipality Zone"
description = "Maps a shipping zone to its municipalities and rate-matching keyword. Read by the municipality-delivery-filter function; editable from the admin without redeploying."
display_name_field = "zone_label"

  [metaobjects.app.municipality_zone.access]
  admin = "merchant_read_write"

[metaobjects.app.municipality_zone.fields.zone_label]
name = "Zone label"
type = "single_line_text_field"
required = true
description = "Human-readable name shown in the admin (e.g. 'Antioquia - Medellín'). Not read by the function."

[metaobjects.app.municipality_zone.fields.config]
name = "Config (JSON)"
type = "json"
required = true
description = "JSON: { zoneKeyword, municipalities: string[], price }. Empty municipalities = catch-all zone. zoneKeyword must appear in this zone's rate title."
