# The zones live in a single JSON metafield on this delivery customization,
# in the app-reserved namespace (namespace omitted). The admin app writes it,
# so zones can be added, removed or edited without redeploying.
query CartDeliveryOptionsTransformRunInput {
  cart {
    deliveryGroups {
      deliveryAddress {
        city
        provinceCode
      }
      deliveryOptions {
        handle
        title
      }
    }
  }
  deliveryCustomization {
    zones: metafield(key: "zones") {
      jsonValue
    }
  }
}
